name: Update filtered Russia list (no YouTube) + SRS

on:
  schedule:
    - cron: '0 3 * * *'          # каждый день в 3:00 UTC
  push:
    branches:
      - main
    paths:
      - 'scripts/filter_and_check.sh'
      - 'russia-inside-noyoutube.lst'   # <-- добавлен триггер при изменении .lst
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v6

      # Шаг 0: определяем, какие файлы изменились в текущем push-коммите
      - name: Определение изменённых файлов
        id: file_changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Сравниваем с предыдущим коммитом
            changed_files=$(git diff --name-only HEAD^ HEAD)
            echo "Изменённые файлы: $changed_files"
            if echo "$changed_files" | grep -q "scripts/filter_and_check.sh"; then
              echo "filter_changed=true" >> $GITHUB_OUTPUT
            else
              echo "filter_changed=false" >> $GITHUB_OUTPUT
            fi
            if echo "$changed_files" | grep -q "russia-inside-noyoutube.lst"; then
              echo "lst_changed=true" >> $GITHUB_OUTPUT
            else
              echo "lst_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            # Для расписания и ручного запуска считаем, что скрипт не менялся, а .lst не менялся (это не важно)
            echo "filter_changed=false" >> $GITHUB_OUTPUT
            echo "lst_changed=false" >> $GITHUB_OUTPUT
          fi

      # Шаг 1: обновляем текстовый список, если это не ручное изменение только .lst
      - name: Запуск скрипта фильтрации (обновляет .lst при изменениях)
        # Выполняем, если:
        # - это не push (расписание или dispatch) ИЛИ
        # - изменился сам скрипт filter_and_check.sh ИЛИ
        # - .lst не был изменён в этом push-коммите
        if: |
          github.event_name != 'push' ||
          steps.file_changes.outputs.filter_changed == 'true' ||
          steps.file_changes.outputs.lst_changed == 'false'
        run: |
          chmod +x scripts/filter_and_check.sh
          ./scripts/filter_and_check.sh

      # Шаг 2: всегда чистим .lst и компилируем .srs (даже если .lst не изменился)
      - name: Очистка .lst и компиляция SRS
        run: |
          # Если файла .lst нет, выходим с ошибкой
          if [ ! -f russia-inside-noyoutube.lst ]; then
            echo "Ошибка: russia-inside-noyoutube.lst не найден"
            exit 1
          fi

          # Удаляем BOM, пустые строки, пробелы
          sed -i '1s/^\xEF\xBB\xBF//' russia-inside-noyoutube.lst 2>/dev/null || true
          sed -i '/^$/d' russia-inside-noyoutube.lst
          sed -i 's/^[ \t]*//; s/[ \t]*$//' russia-inside-noyoutube.lst

          # Проверяем, что файл не пуст
          if [ ! -s russia-inside-noyoutube.lst ]; then
            echo "Предупреждение: russia-inside-noyoutube.lst пуст после очистки"
            echo '{"version": 3, "rules": []}' > rules.json
          else
            # Формируем корректный JSON для sing-box
            echo '{"version": 3, "rules": [{"domain_suffix": [' > rules.json
            sed 's/^/"/; s/$/"/' russia-inside-noyoutube.lst | paste -sd ',' >> rules.json
            echo ']}]}' >> rules.json
          fi

          # Компилируем SRS через Docker
          docker run --rm -v "${GITHUB_WORKSPACE}:/data" ghcr.io/sagernet/sing-box:latest \
            rule-set compile --output /data/russia-inside-noyoutube.srs /data/rules.json

          # Проверяем, создан ли файл
          if [ -f russia-inside-noyoutube.srs ]; then
            echo "✅ SRS файл создан успешно"
            ls -la russia-inside-noyoutube.srs
          else
            echo "❌ Ошибка: SRS файл не был создан"
            exit 1
          fi

          # Удаляем временный JSON
          rm -f rules.json

      # Шаг 3: проверяем, изменился ли .lst или .srs (или .last_checksums)
      - name: Проверка изменений
        id: changes
        run: |
          git diff --quiet russia-inside-noyoutube.lst .last_checksums russia-inside-noyoutube.srs || echo "changed=true" >> $GITHUB_OUTPUT

      # Шаг 4: коммит и пуш, если есть изменения
      - name: Коммит и пуш
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add russia-inside-noyoutube.lst russia-inside-noyoutube.srs .last_checksums
          git commit -m "Автообновление: изменения в списках и SRS [skip ci]"
          git push

      # Шаг 5: уведомление в Telegram (только при изменениях)
      - name: Уведомление в Telegram
        if: steps.changes.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔔 *Обновлён список доменов и SRS*%0A%0A📁 \`russia-inside-noyoutube.lst\`%0A📦 \`russia-inside-noyoutube.srs\`%0A🔗 [Смотреть файлы](https://github.com/${{ github.repository }})%0A📦 [Коммит](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d text="${MESSAGE}"
