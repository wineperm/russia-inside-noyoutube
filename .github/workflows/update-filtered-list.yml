name: Update filtered Russia list (no YouTube) + SRS

on:
  schedule:
    - cron: '0 3 * * *'          # ежедневно в 3:00 UTC
  push:
    branches:
      - main
    paths:
      - 'scripts/filter_and_check.sh'
      - 'russia-inside-noyoutube.lst'
      - 'custom_allow.lst'        # добавлен триггер
      - 'custom_deny.lst'         # добавлен триггер
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v6

      # --- Определяем, какие файлы изменились в push-коммите ---
      - name: Определение изменённых файлов
        id: file_changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              changed_files=$(git diff --name-only HEAD^ HEAD)
            else
              changed_files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            fi
            echo "Изменённые файлы: $changed_files"
            if echo "$changed_files" | grep -q "scripts/filter_and_check.sh"; then
              echo "filter_changed=true" >> $GITHUB_OUTPUT
            else
              echo "filter_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "filter_changed=false" >> $GITHUB_OUTPUT
          fi

      # --- Запуск фильтрации ТОЛЬКО при расписании/ручном запуске ИЛИ при изменении скрипта ---
      - name: Запуск скрипта фильтрации (обновляет .lst из источников)
        if: |
          github.event_name != 'push' ||
          steps.file_changes.outputs.filter_changed == 'true'
        run: |
          chmod +x scripts/filter_and_check.sh
          ./scripts/filter_and_check.sh

      # --- Всегда применяем custom-правила и компилируем SRS ---
      - name: Применение пользовательских правил и компиляция SRS
        run: |
          # Проверяем наличие .lst
          if [ ! -f russia-inside-noyoutube.lst ]; then
            echo "Ошибка: russia-inside-noyoutube.lst не найден"
            exit 1
          fi

          # Чистим .lst от мусора
          sed -i '1s/^\xEF\xBB\xBF//' russia-inside-noyoutube.lst 2>/dev/null || true
          sed -i '/^$/d' russia-inside-noyoutube.lst
          sed -i 's/^[ \t]*//; s/[ \t]*$//' russia-inside-noyoutube.lst

          # Создаём финальный список на основе .lst + custom-правила
          cp russia-inside-noyoutube.lst final.lst

          # Удаляем домены из custom_deny.lst (если существует)
          if [ -f custom_deny.lst ]; then
            # Убираем комментарии и пустые строки
            sed -i 's/^[ \t]*//; s/[ \t]*$//' custom_deny.lst
            sed -i '/^$/d' custom_deny.lst
            # Удаляем каждый домен из final.lst
            while IFS= read -r deny_domain; do
              if [ -n "$deny_domain" ]; then
                sed -i "/^$deny_domain$/d" final.lst
              fi
            done < custom_deny.lst
          fi

          # Добавляем домены из custom_allow.lst (если существует)
          if [ -f custom_allow.lst ]; then
            sed -i 's/^[ \t]*//; s/[ \t]*$//' custom_allow.lst
            sed -i '/^$/d' custom_allow.lst
            while IFS= read -r allow_domain; do
              if [ -n "$allow_domain" ] && ! grep -qxF "$allow_domain" final.lst; then
                echo "$allow_domain" >> final.lst
              fi
            done < custom_allow.lst
          fi

          # Если final.lst пуст – создаём пустой JSON
          if [ ! -s final.lst ]; then
            echo "Предупреждение: финальный список пуст"
            echo '{"version": 3, "rules": []}' > rules.json
          else
            echo '{"version": 3, "rules": [{"domain_suffix": [' > rules.json
            sed 's/^/"/; s/$/"/' final.lst | paste -sd ',' >> rules.json
            echo ']}]}' >> rules.json
          fi

          # Компилируем SRS через Docker
          docker run --rm -v "${GITHUB_WORKSPACE}:/data" ghcr.io/sagernet/sing-box:latest \
            rule-set compile --output /data/russia-inside-noyoutube.srs /data/rules.json

          if [ -f russia-inside-noyoutube.srs ]; then
            echo "✅ SRS файл создан успешно"
            ls -la russia-inside-noyoutube.srs
          else
            echo "❌ Ошибка: SRS файл не был создан"
            exit 1
          fi

          # Удаляем временные файлы
          rm -f rules.json final.lst

      # --- Проверяем, изменились ли файлы (для коммита и уведомления) ---
      - name: Проверка изменений
        id: changes
        run: |
          git diff --quiet russia-inside-noyoutube.lst .last_checksums russia-inside-noyoutube.srs || echo "changed=true" >> $GITHUB_OUTPUT

      # --- Коммит и пуш (только если что-то изменилось) ---
      - name: Коммит и пуш
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add russia-inside-noyoutube.lst russia-inside-noyoutube.srs .last_checksums
          git commit -m "Автообновление: изменения в списках и SRS [skip ci]"
          git push

      # --- Уведомление в Telegram ---
      - name: Уведомление в Telegram
        if: steps.changes.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔔 *Обновлён список доменов и SRS*%0A%0A📁 \`russia-inside-noyoutube.lst\`%0A📦 \`russia-inside-noyoutube.srs\`%0A🔗 [Смотреть файлы](https://github.com/${{ github.repository }})%0A📦 [Коммит](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d text="${MESSAGE}"
