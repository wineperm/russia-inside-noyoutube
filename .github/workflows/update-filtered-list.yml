name: Update filtered Russia list (no YouTube) + SRS

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/filter_and_check.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Запуск скрипта фильтрации
        run: |
          chmod +x scripts/filter_and_check.sh
          ./scripts/filter_and_check.sh

      - name: Очистка и проверка .lst
        run: |
          if [ -f russia-inside-noyoutube.lst ]; then
            sed -i '1s/^\xEF\xBB\xBF//' russia-inside-noyoutube.lst 2>/dev/null || true
            sed -i '/^$/d' russia-inside-noyoutube.lst
            sed -i 's/^[ \t]*//; s/[ \t]*$//' russia-inside-noyoutube.lst
            echo "Первые 5 строк:"
            head -n 5 russia-inside-noyoutube.lst
            if [ ! -s russia-inside-noyoutube.lst ]; then
              echo "Ошибка: файл пуст"
              exit 1
            fi
          else
            echo "Файл не найден"
            exit 1
          fi

      - name: Компиляция SRS из .lst (JSON с rules)
        run: |
          echo '{"version": 1, "rules": [{"domain": [' > rules.json
          sed 's/^/"/; s/$/"/' russia-inside-noyoutube.lst | paste -sd ',' >> rules.json
          echo ']}]}' >> rules.json
          echo "Проверка JSON (первые 200 символов):"
          head -c 200 rules.json
          docker run --rm -v $(pwd):/data ghcr.io/sagernet/sing-box:latest \
            rule-set compile --output /data/russia-inside-noyoutube.srs /data/rules.json
          rm rules.json
          echo "SRS скомпилирован"

      - name: Проверка изменений
        id: changes
        run: |
          git diff --quiet russia-inside-noyoutube.lst .last_checksums russia-inside-noyoutube.srs || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Коммит и пуш
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add russia-inside-noyoutube.lst russia-inside-noyoutube.srs .last_checksums
          git commit -m "Автообновление: изменения в списках и SRS [skip ci]"
          git push

      - name: Уведомление в Telegram
        if: steps.changes.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔔 *Обновлён список доменов и SRS*%0A%0A📁 \`russia-inside-noyoutube.lst\`%0A📦 \`russia-inside-noyoutube.srs\`%0A🔗 [Смотреть файлы](https://github.com/${{ github.repository }})%0A📦 [Коммит](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d parse_mode=Markdown \
            -d text="${MESSAGE}"
